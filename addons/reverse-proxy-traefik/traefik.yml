entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false # only containers with traefik.enable=true
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "you@example.com" # CHANGE ME before first start
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
      # --- Wildcard certs (*.example.com) via DNS challenge instead ---
      # Works even when port 80 isn't reachable from the internet (LAN/VPN-only
      # setups!). Replace httpChallenge above with:
      # dnsChallenge:
      #   provider: cloudflare # 100+ providers: https://doc.traefik.io/traefik/https/acme/#providers
      # ...and pass the provider credential in docker-compose.yml, e.g.:
      #   environment:
      #     CF_DNS_API_TOKEN: "your-token"

api:
  dashboard: true
  insecure: true # served on :8080, which is bound to 127.0.0.1 in compose

log:
  level: INFO

accessLog: {} # stdout — picked up by Loki/Alloy or CrowdSec
