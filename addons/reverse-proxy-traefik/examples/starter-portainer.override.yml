# Override for paths/01-starter/portainer/docker-compose.yml — see README.md here.
services:
  portainer:
    ports: !reset [] # reachable only via Traefik
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.example.com`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls.certresolver=letsencrypt
      - traefik.http.routers.portainer.middlewares=internal-only@file
      # Traefik talks to Portainer's internal HTTP port:
      - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  proxy:
    external: true
