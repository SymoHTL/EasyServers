# Override for paths/01-starter/uptime-kuma/docker-compose.yml — see README.md here.
services:
  uptime-kuma:
    ports: !reset [] # reachable only via Traefik
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime-kuma.rule=Host(`status.example.com`)
      - traefik.http.routers.uptime-kuma.entrypoints=websecure
      - traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt
      # Remove this middleware if you publish a public status page:
      - traefik.http.routers.uptime-kuma.middlewares=internal-only@file
      - traefik.http.services.uptime-kuma.loadbalancer.server.port=3001

networks:
  proxy:
    external: true
