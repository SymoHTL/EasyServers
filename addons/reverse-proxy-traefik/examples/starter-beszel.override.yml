# Override for paths/01-starter/beszel/hub/docker-compose.yml — see README.md here.
services:
  beszel:
    ports: !reset [] # reachable only via Traefik
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.beszel.rule=Host(`beszel.example.com`)
      - traefik.http.routers.beszel.entrypoints=websecure
      - traefik.http.routers.beszel.tls.certresolver=letsencrypt
      - traefik.http.routers.beszel.middlewares=internal-only@file
      - traefik.http.services.beszel.loadbalancer.server.port=8090

networks:
  proxy:
    external: true
