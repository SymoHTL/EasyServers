global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics (node-exporter) — add hosts in targets/nodes.yml, no restart needed
  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/nodes.yml"]
        refresh_interval: 1m

  # Container metrics (cAdvisor) — add hosts in targets/cadvisor.yml
  - job_name: cadvisor
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor.yml"]
        refresh_interval: 1m
