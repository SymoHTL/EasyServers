# Run this on REMOTE servers you want to manage from the Portainer hub UI.
# Then add it in Portainer: Environments -> Add environment -> Docker (agent).
services:
  portainer_agent:
    image: portainer/agent:lts
    container_name: portainer_agent
    restart: unless-stopped
    ports:
      - "9001:9001" # restrict with ufw to the hub's IP!
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
