# Run this on EVERY server you want to monitor (including the hub itself).
# Get the KEY from the hub UI: Add system -> copy public key into .env.
services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host # agent listens on 45876; restrict with ufw to the hub's IP
    environment:
      LISTEN: "45876"
      KEY: "${BESZEL_AGENT_KEY:?set BESZEL_AGENT_KEY in .env (public key from the hub UI)}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # for per-container stats
